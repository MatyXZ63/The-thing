<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my girlfriend?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #FFB6C1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Goudy Old Style', 'Palatino Linotype', serif;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            top: -20px;
            font-size: 14px;
            animation: fall linear forwards;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #5a2a4a;
            margin-bottom: 2rem;
            font-family: 'Goudy Old Style', 'Palatino Linotype', serif;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.3rem;
            color: #5a2a4a;
            cursor: pointer;
            font-family: 'Goudy Old Style', 'Palatino Linotype', serif;
        }

        .option input {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #ff69b4;
        }

        #no-option {
            position: relative;
            transition: none;
        }

        .yes-msg {
            margin-top: 2rem;
            font-size: 1.5rem;
            color: #ff1493;
            display: none;
        }

        .signature-img {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            opacity: 0.8;
            z-index: 2;
        }

        .timer {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1rem;
            color: #8b4a6a;
            opacity: 0.8;
            z-index: 2;
            font-style: italic;
            display: none;
        }

        .timer-emoji {
            font-size: 1.5rem;
            margin-right: 0.3rem;
        }
    </style>
</head>
<body>
<img src="signature.png" alt="signature" class="signature-img">
<div class="stars" id="stars"></div>

<div class="card">
    <h1>Will you be my girlfriend?</h1>
    <div class="options">
        <label class="option" id="yes-option">
            <input type="checkbox" id="yes-check">
            Absolutely
        </label>
        <label class="option" id="no-option">
            <input type="checkbox" id="no-check">
            <span id="no-text">No</span>
        </label>
    </div>
    <p class="yes-msg" id="yes-msg">I knew you couldn't refuse me <3</p>
</div>

<p class="timer" id="timer"><span class="timer-emoji" id="timer-emoji">😊</span><span id="timer-text"></span></p>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
    const starsContainer = document.getElementById('stars');
    const starChars = ['✦', '✧', '⭐', '⋆', '✩', '✨'];

    function createStar() {
        const star = document.createElement('div');
        star.classList.add('star');
        star.textContent = starChars[Math.floor(Math.random() * starChars.length)];
        star.style.left = Math.random() * 100 + 'vw';
        star.style.fontSize = (10 + Math.random() * 16) + 'px';
        star.style.animationDuration = (3 + Math.random() * 4) + 's';
        starsContainer.appendChild(star);
        star.addEventListener('animationend', () => star.remove());
    }

    setInterval(createStar, 200);

    const timerEl = document.getElementById('timer');
    const timerEmoji = document.getElementById('timer-emoji');
    const timerText = document.getElementById('timer-text');
    let seconds = 0;
    let timerStarted = false;

    setTimeout(() => {
        timerStarted = true;
        timerEl.style.display = 'block';
    }, 5000);

    setInterval(() => {
        if (timerStarted) {
            seconds++;
            timerText.textContent = "You've been thinking about it for " + seconds + " seconds…";
            if (seconds <= 4) {
                timerEmoji.textContent = '😊';
            } else if (seconds <= 9) {
                timerEmoji.textContent = '😐';
            } else if (seconds <= 14) {
                timerEmoji.textContent = '😢';
            } else {
                timerEmoji.textContent = '🤔';
            }
        }
    }, 1000);

    const noOption = document.getElementById('no-option');
    const noCheck = document.getElementById('no-check');
    const noText = document.getElementById('no-text');
    let noCount = 0;
    let noSize = 1.3;

    const noMessages = [
        'No',
        'Are you sure?',
        'Really?',
        "You can't catch me!",
        'Think again 😏',
        'Last chance!',
        'Just say yes already 💕'
    ];

    function teleport() {
        noCount++;
        noSize = Math.max(0.5, noSize - 0.1);
        noOption.style.fontSize = noSize + 'rem';
        noText.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];

        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 50);
        noOption.style.position = 'fixed';
        noOption.style.left = x + 'px';
        noOption.style.top = y + 'px';
    }

    noCheck.addEventListener('click', (e) => {
        e.preventDefault();
        noCheck.checked = false;
        teleport();
    });

    noOption.addEventListener('mouseenter', teleport);

    const yesCheck = document.getElementById('yes-check');
    yesCheck.addEventListener('change', () => {
        if (yesCheck.checked) {
            document.getElementById('yes-msg').style.display = 'block';
            timerEl.style.display = 'none';
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.7 } });
            setTimeout(() => confetti({ particleCount: 100, spread: 150, origin: { y: 0.5 } }), 500);
        }
    });
</script>

</body>
</html>
