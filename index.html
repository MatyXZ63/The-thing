<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my girlfriend?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #FFDAB9;
            background: #FFB6C1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Goudy Old Style', 'Palatino Linotype', serif;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            top: -20px;
            font-size: 14px;
            animation: fall linear forwards;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #5a2a4a;
            margin-bottom: 2rem;
            font-family: 'Goudy Old Style', 'Palatino Linotype', serif;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.3rem;
            color: #5a2a4a;
            cursor: pointer;
            font-family: 'Goudy Old Style', 'Palatino Linotype', serif;
        }

        .option input {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #ff69b4;
        }

        #no-option {
            position: relative;
            transition: none;
        }

        .yes-msg {
            margin-top: 2rem;
            font-size: 1.5rem;
            color: #ff1493;
            display: none;
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="card">
    <h1>Will you be my girlfriend?</h1>
    <div class="options">
        <label class="option" id="yes-option">
            <input type="checkbox" id="yes-check">
            Absolutely
        </label>
        <label class="option" id="no-option">
            <input type="checkbox" id="no-check">
            No
        </label>
    </div>
    <p class="yes-msg" id="yes-msg">Yay! 🎉 I knew it!</p>
</div>

<script>
    // Falling stars
    const starsContainer = document.getElementById('stars');
    const starChars = ['✦', '✧', '⭐', '⋆', '✩', '✨'];

    function createStar() {
        const star = document.createElement('div');
        star.classList.add('star');
        star.textContent = starChars[Math.floor(Math.random() * starChars.length)];
        star.style.left = Math.random() * 100 + 'vw';
        star.style.fontSize = (10 + Math.random() * 16) + 'px';
        star.style.animationDuration = (3 + Math.random() * 4) + 's';
        starsContainer.appendChild(star);

        star.addEventListener('animationend', () => star.remove());
    }

    setInterval(createStar, 300);

    // "No" checkbox teleport
    const noOption = document.getElementById('no-option');
    const noCheck = document.getElementById('no-check');

    function teleport() {
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 50);
        noOption.style.position = 'fixed';
        noOption.style.left = x + 'px';
        noOption.style.top = y + 'px';
    }

    noCheck.addEventListener('click', (e) => {
        e.preventDefault();
        noCheck.checked = false;
        teleport();
    });

    noOption.addEventListener('mouseenter', teleport);

    // "Yes" checkbox
    const yesCheck = document.getElementById('yes-check');
    yesCheck.addEventListener('change', () => {
        if (yesCheck.checked) {
            document.getElementById('yes-msg').style.display = 'block';
        }
    });
</script>

</body>
</html>
